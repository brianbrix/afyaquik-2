# Traefik static configuration file
# This file contains middleware and security configurations

http:
  middlewares:
    # Security headers middleware
    security-headers:
      headers:
        customRequestHeaders:
          X-Forwarded-Proto: "https"
        customResponseHeaders:
          X-Frame-Options: "DENY"
          X-Content-Type-Options: "nosniff"
          X-XSS-Protection: "1; mode=block"
          Strict-Transport-Security: "max-age=31536000; includeSubDomains"
          Referrer-Policy: "strict-origin-when-cross-origin"
          Content-Security-Policy: "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:; frame-ancestors 'none';"

    # CORS headers for API
    cors-headers:
      headers:
        customResponseHeaders:
          Access-Control-Allow-Origin: "https://afyaquik.com"
          Access-Control-Allow-Methods: "GET, POST, PUT, DELETE, OPTIONS, PATCH"
          Access-Control-Allow-Headers: "Content-Type, Authorization, X-Requested-With, X-Tenant-Id"
          Access-Control-Allow-Credentials: "true"
          Access-Control-Max-Age: "86400"

    # Rate limiting for API
    api-rate-limit:
      rateLimit:
        burst: 100
        average: 50

    # Basic auth for Traefik dashboard (optional)
    traefik-auth:
      basicAuth:
        users:
          - "admin:$2y$10$8K1p/a0dL3L4qK1p/a0dL3L4qK1p/a0dL3L4qK1p/a0dL3L4qK1p/a0dL3L4qK1p"  # admin:password (change this!)

# Global settings
global:
  checkNewVersion: false
  sendAnonymousUsage: false
