version: "3.8"

services:
  traefik:
    image: traefik:v3.1
    container_name: traefik
    restart: unless-stopped
    command:
      # API and dashboard
      - "--api.insecure=false"
      - "--api.dashboard=true"
      
      # Docker provider
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      
      # Entry points
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      
      # Redirect HTTP to HTTPS
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      
      # Let's Encrypt configuration
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=admin@afyaquik.com"  # Change this email!
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      
      # Security and performance
      - "--entrypoints.websecure.http.middlewares=security-headers@file"
      - "--log.level=INFO"
      - "--accesslog=true"

    ports:
      - "80:80"        # HTTP traffic (redirects to HTTPS)
      - "443:443"      # HTTPS traffic
      - "8080:8080"    # Traefik dashboard (https://traefik.afyaquik.com)

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./letsencrypt:/letsencrypt
      - ./traefik-config.yml:/etc/traefik/traefik.yml:ro

    labels:
      # Enable Traefik for itself
      - "traefik.enabled=true"
      
      # Dashboard router
      - "traefik.http.routers.traefik.rule=Host(`traefik.afyaquik.com`)"
      - "traefik.http.routers.traefik.entrypoints=websecure"
      - "traefik.http.routers.traefik.tls.certresolver=letsencrypt"
      - "traefik.http.routers.traefik.service=api@internal"
      - "traefik.http.routers.traefik.middlewares=traefik-auth"

  # HMS Backend API
  hms-backend:
    image: afyaquik/hms-backend:latest
    container_name: hms-backend
    restart: unless-stopped
    environment:
      - SPRING_PROFILES_ACTIVE=production
      - SERVER_PORT=8080
      - SPRING_DATASOURCE_URL=jdbc:postgresql://hms-db:5432/hms
      - SPRING_DATASOURCE_USERNAME=hms_user
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
    depends_on:
      - hms-db
    labels:
      - "traefik.enabled=true"
      - "traefik.http.routers.hms-api.rule=Host(`api.afyaquik.com`)"
      - "traefik.http.routers.hms-api.entrypoints=websecure"
      - "traefik.http.routers.hms-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.hms-api.service=hms-api"
      - "traefik.http.services.hms-api.loadbalancer.server.port=8080"
      - "traefik.http.routers.hms-api.middlewares=cors-headers,api-rate-limit"

  # HMS Frontend Application
  hms-frontend:
    image: afyaquik/hms-frontend:latest
    container_name: hms-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - REACT_APP_API_URL=https://api.afyaquik.com
    labels:
      - "traefik.enabled=true"
      - "traefik.http.routers.hms-frontend.rule=Host(`app.afyaquik.com`)"
      - "traefik.http.routers.hms-frontend.entrypoints=websecure"
      - "traefik.http.routers.hms-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.hms-frontend.service=hms-frontend"
      - "traefik.http.services.hms-frontend.loadbalancer.server.port=80"
      - "traefik.http.routers.hms-frontend.middlewares=security-headers"

  # PostgreSQL Database
  hms-db:
    image: postgres:15-alpine
    container_name: hms-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=hms
      - POSTGRES_USER=hms_user
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - hms-data:/var/lib/postgresql/data
    labels:
      - "traefik.enabled=false"  # Database should not be exposed

  # Redis for caching
  hms-redis:
    image: redis:7-alpine
    container_name: hms-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    labels:
      - "traefik.enabled=false"  # Redis should not be exposed

  # Example: Additional service template
  # Replace this with your actual services
  # example-service:
  #   image: your-service:latest
  #   container_name: example-service
  #   restart: unless-stopped
  #   labels:
  #     - "traefik.enabled=true"
  #     - "traefik.http.routers.example.rule=Host(`example.afyaquik.com`)"
  #     - "traefik.http.routers.example.entrypoints=websecure"
  #     - "traefik.http.routers.example.tls.certresolver=letsencrypt"
  #     - "traefik.http.routers.example.service=example"
  #     - "traefik.http.services.example.loadbalancer.server.port=3000"

volumes:
  hms-data:
    driver: local
  redis-data:
    driver: local

networks:
  default:
    name: traefik-network
