# Service Template for Adding New Services to Traefik
# Copy this template and modify it for your new service

version: "3.8"

services:
  # Example: New Service Template
  your-new-service:
    image: your-service:latest
    container_name: your-new-service
    restart: unless-stopped
    environment:
      # Add your environment variables here
      - NODE_ENV=production
      - DATABASE_URL=postgresql://user:pass@hms-db:5432/dbname
    depends_on:
      - hms-db  # Add dependencies if needed
    labels:
      # Enable Traefik for this service
      - "traefik.enabled=true"
      
      # Router configuration
      - "traefik.http.routers.your-service.rule=Host(`your-service.afyaquik.com`)"
      - "traefik.http.routers.your-service.entrypoints=websecure"
      - "traefik.http.routers.your-service.tls.certresolver=letsencrypt"
      
      # Service configuration
      - "traefik.http.routers.your-service.service=your-service"
      - "traefik.http.services.your-service.loadbalancer.server.port=3000"  # Change port as needed
      
      # Middleware (optional)
      - "traefik.http.routers.your-service.middlewares=security-headers"
      
      # Rate limiting (optional)
      - "traefik.http.routers.your-service.middlewares=api-rate-limit"

# Common Service Patterns:

# 1. Web Application (React/Vue/Angular)
# web-app:
#   image: your-web-app:latest
#   container_name: web-app
#   restart: unless-stopped
#   labels:
