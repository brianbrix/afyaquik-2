# Adding Services to Existing Setup:
# 1. Copy this template
# 2. Modify the service name, image, and domain
# 3. Add to your docker-compose file
# 4. Run: docker-compose up -d your-new-service
# 5. Check: ./health-check.sh

# Domain Naming Convention:
# - app.afyaquik.com (main application)
# - api.afyaquik.com (main API)
# - admin.afyaquik.com (admin panel)
# - docs.afyaquik.com (documentation)
# - monitoring.afyaquik.com (monitoring)
# - your-service.afyaquik.com (custom services)
