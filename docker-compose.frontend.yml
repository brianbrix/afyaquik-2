version: '3.8'

services:
  hms-frontend:
    build:
      context: ./hms-frontend
      dockerfile: Dockerfile.frontend
      args:
        - VITE_API_BASE_URL=/api/v1
    # container_name: hms-frontend  # Remove for scaling
    environment:
      - NODE_ENV=production
    networks:
      - hms-network
      - traefik_proxy
    # deploy:
    #   replicas: 3
    restart: unless-stopped
    volumes:
      - ./hms-frontend/nginx.conf:/etc/nginx/nginx.conf:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hms-frontend.rule=Host(`app.afyaquik.com`)"
      - "traefik.http.routers.hms-frontend.entrypoints=websecure"
      - "traefik.http.routers.hms-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.hms-frontend.service=hms-frontend"
      - "traefik.http.services.hms-frontend.loadbalancer.server.port=80"
      - "traefik.http.routers.hms-frontend.middlewares=security-headers@file"
      - "traefik.http.routers.hms-frontend.priority=1"

networks:
  hms-network:
    driver: bridge
  traefik_proxy:
    external: true