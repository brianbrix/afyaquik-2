version: '3.8'

services:
  hms-frontend:
    build:
      context: ./hms-frontend
      dockerfile: Dockerfile.frontend
    container_name: hms-frontend
    environment:
      - NODE_ENV=production
      - VITE_API_BASE_URL=http://hms-backend:8080/api/v1
      - VITE_APP_TITLE=AfyaQuik HMS
    networks:
      - hms-network
      - traefik_proxy
    ports:
      - 8081:80
    restart: unless-stopped
    volumes:
      - ./hms-frontend/nginx.conf:/etc/nginx/nginx.conf:ro

networks:
  hms-network:
    driver: bridge
  traefik_proxy:
    external: true