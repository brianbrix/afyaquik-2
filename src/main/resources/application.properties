spring.application.name=hms

# Primary datasource (PostgreSQL)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5434/afyaquik}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

logging.level.org.hibernate.SQL=WARN

# JWT security defaults
app.security.jwt.secret=${JWT_SECRET:change-this-secret-key-change-this-secret-key}
app.security.jwt.access-token-ttl-seconds=${JWT_ACCESS_TTL:900}
app.security.jwt.refresh-token-ttl-seconds=${JWT_REFRESH_TTL:604800}
afyaquik.default-admin.tenant=clinic-a
afyaquik.default-admin.username=admin

# MinIO Configuration
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin123}
minio.bucket-name=${MINIO_BUCKET_NAME:diagnostic-files}

# Email Configuration
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=${SMTP_HOST:smtp.gmail.com}

# Logging configuration
#logging.level.root=TRACE
# logging.level.org.springframework=DEBUG
#logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate=INFO
logging.file.name=logs/hms-application.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level