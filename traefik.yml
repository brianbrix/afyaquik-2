version: "3.8"

services:
  traefik:
    image: traefik:v3.1
    container_name: traefik
    command:
      # API and dashboard
      - "--api.insecure=false"
      - "--api.dashboard=true"
      
      # Docker provider
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      
      # Entry points
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      
      # Redirect HTTP to HTTPS
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      
      # Let's Encrypt configuration
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=admin@afyaquik.com"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      
      # Security headers
      - "--entrypoints.websecure.http.middlewares=security-headers@file"
      
      # Logging
      - "--log.level=INFO"
      - "--accesslog=true"

    ports:
      - "80:80"        # HTTP traffic (redirects to HTTPS)
      - "443:443"      # HTTPS traffic
      - "8080:8080"    # Traefik dashboard (https://traefik.afyaquik.com)

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./letsencrypt:/letsencrypt
      - ./traefik.yml:/etc/traefik/traefik.yml:ro

    labels:
      # Enable Traefik for itself
      - "traefik.enabled=true"
      
      # Dashboard router
      - "traefik.http.routers.traefik.rule=Host(`traefik.afyaquik.com`)"
      - "traefik.http.routers.traefik.entrypoints=websecure"
      - "traefik.http.routers.traefik.tls.certresolver=letsencrypt"
      - "traefik.http.routers.traefik.service=api@internal"

  # HMS Backend API
  hms-backend:
    image: your-hms-backend-image:latest  # Replace with your actual backend image
    container_name: hms-backend
    environment:
      - SPRING_PROFILES_ACTIVE=production
      - SERVER_PORT=8080
    labels:
      - "traefik.enabled=true"
      - "traefik.http.routers.hms-api.rule=Host(`api.afyaquik.com`)"
      - "traefik.http.routers.hms-api.entrypoints=websecure"
      - "traefik.http.routers.hms-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.hms-api.service=hms-api"
      - "traefik.http.services.hms-api.loadbalancer.server.port=8080"
      - "traefik.http.routers.hms-api.middlewares=cors-headers"

  # HMS Frontend
  hms-frontend:
    image: your-hms-frontend-image:latest  # Replace with your actual frontend image
    container_name: hms-frontend
    labels:
      - "traefik.enabled=true"
      - "traefik.http.routers.hms-frontend.rule=Host(`app.afyaquik.com`)"
      - "traefik.http.routers.hms-frontend.entrypoints=websecure"
      - "traefik.http.routers.hms-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.hms-frontend.service=hms-frontend"
      - "traefik.http.services.hms-frontend.loadbalancer.server.port=80"

  # Test service (remove in production)
  whoami:
    image: traefik/whoami
    container_name: whoami
    labels:
      - "traefik.enabled=true"
      - "traefik.http.routers.whoami.rule=Host(`test.afyaquik.com`)"
      - "traefik.http.routers.whoami.entrypoints=websecure"
      - "traefik.http.routers.whoami.tls.certresolver=letsencrypt"
      - "traefik.http.routers.whoami.service=whoami"
      - "traefik.http.services.whoami.loadbalancer.server.port=80"

networks:
  default:
    name: traefik-network
