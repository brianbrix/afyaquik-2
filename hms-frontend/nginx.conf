events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen       80;
        server_name  localhost;
        root   /usr/share/nginx/html;
        index  index.html;

        # Proper MIME type configuration
        types {
            text/html html htm shtml;
            text/css css;
            application/javascript js mjs;
            application/wasm wasm;
            image/svg+xml svg svgz;
            application/json json;
        }

        gzip on;
        gzip_types 
            text/plain 
            text/css 
            application/json 
            application/javascript 
            text/xml 
            application/xml 
            application/xml+rss 
            text/javascript 
            application/wasm 
            image/svg+xml;

        # Main location - serve HTML files correctly
        location / {
            try_files $uri $uri/ /index.html;
            add_header Content-Type text/html;
        }

        # Specific handling for HTML files
        location ~ \.html$ {
            add_header Content-Type text/html;
            try_files $uri =404;
        }

        # Specific handling for JavaScript files
        location ~ \.m?js$ {
            add_header Content-Type application/javascript;
            try_files $uri =404;
        }

        # Specific handling for CSS files
        location ~ \.css$ {
            add_header Content-Type text/css;
            try_files $uri =404;
        }

        # Specific handling for SVG files
        location ~ \.svg$ {
            add_header Content-Type image/svg+xml;
            try_files $uri =404;
        }

        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        location /api/ {
            proxy_pass http://hms-backend:8080/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_buffering off;
        }

        # Fallback for any file not found
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            try_files $uri =404;
            access_log off;
            expires max;
        }
    }
}