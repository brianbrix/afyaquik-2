events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Custom MIME types to override any issues
    types {
        text/html                                        html htm shtml;
        text/css                                         css;
        text/xml                                         xml;
        image/gif                                        gif;
        image/jpeg                                       jpeg jpg;
        application/javascript                           js mjs;
        application/wasm                                 wasm;
        text/javascript                                  js;
        application/x-javascript                         js;
        image/svg+xml                                    svg svgz;
        application/json                                 json;
        font/woff                                        woff;
        font/woff2                                       woff2;
        application/font-woff                            woff;
        application/font-woff2                           woff2;
    }

    server {
        listen       80;
        server_name  localhost;
        root   /usr/share/nginx/html;
        index  index.html;

        # Gzip compression
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_proxied any;
        gzip_comp_level 6;
        gzip_types
            text/plain
            text/css
            text/xml
            text/javascript
            application/javascript
            application/x-javascript
            application/json
            application/xml
            application/xml+rss
            image/svg+xml;

        # Main SPA route
        location / {
            try_files $uri $uri/ /index.html;
        }

        # CSS files - force correct MIME type
        location ~ \.css$ {
            add_header Content-Type text/css;
            try_files $uri =404;
            # Cache for 1 year
            add_header Cache-Control "public, immutable, max-age=31536000";
        }

        # JavaScript files - force correct MIME type
        location ~ \.js$ {
            add_header Content-Type application/javascript;
            try_files $uri =404;
            add_header Cache-Control "public, immutable, max-age=31536000";
            add_header X-Content-Type-Options nosniff;
        }

        # Module JavaScript files
        location ~ \.mjs$ {
            add_header Content-Type application/javascript;
            try_files $uri =404;
            add_header Cache-Control "public, immutable, max-age=31536000";
            add_header X-Content-Type-Options nosniff;
        }

        # Assets directory
        location /assets/ {
            # CSS in assets
            location ~ \.css$ {
                add_header Content-Type text/css;
            }
            # JS in assets
            location ~ \.js$ {
                add_header Content-Type application/javascript;
                add_header X-Content-Type-Options nosniff;
            }
            # Images and fonts in assets
            location ~ \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                add_header Cache-Control "public, immutable, max-age=31536000";
            }
            try_files $uri =404;
            add_header Cache-Control "public, immutable, max-age=31536000";
        }

        # Font files
        location ~ \.(woff|woff2|ttf|eot)$ {
            add_header Content-Type application/font-woff;
            add_header Cache-Control "public, immutable, max-age=31536000";
            try_files $uri =404;
        }

        # Image files
        location ~ \.(png|jpg|jpeg|gif|ico|svg)$ {
            add_header Cache-Control "public, max-age=31536000";
            try_files $uri =404;
        }

        # SVG files
        location ~ \.svg$ {
            add_header Content-Type image/svg+xml;
            try_files $uri =404;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        
        # HTTPS security headers (Traefik will handle HTTPS)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
}